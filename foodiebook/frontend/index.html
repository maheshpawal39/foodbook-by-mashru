<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#800020" />
    <meta name="description" content="FoodieBook by Marshru — a premium bilingual recipe management and food discovery platform." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FoodieBook by Marshru</title>
    <script>
      try {
        const theme = localStorage.getItem('fb-theme')
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        const lang = localStorage.getItem('fb-lang')
        if (lang) document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
